<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000">
  <title>Polar Express Train Ambience</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #cover {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000 url("https://i.ytimg.com/vi/tmC1iYXb_og/maxresdefault.jpg") center / cover no-repeat;
    }

    #play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 90px;
      height: 62px;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 16px;
      background: #ff0000;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
      transition: background .18s ease, transform .18s ease;
    }

    #play:hover {
      background: #e60000;
      transform: translate(-50%, -50%) scale(1.08);
    }

    #play:focus-visible {
      outline: 4px solid #fff;
      outline-offset: 5px;
    }

    #play::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-42%, -50%);
      border-style: solid;
      border-width: 16px 0 16px 28px;
      border-color: transparent transparent transparent #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    @media (prefers-reduced-motion: reduce) {
      #play { transition: none; }
    }
  </style>
</head>
<body>
  <main id="cover" aria-label="Polar Express Train Ambience video cover">
    <button id="play" type="button" aria-label="Play Polar Express Train Ambience"></button>
  </main>

  <script>
    const cover = document.getElementById("cover");

    document.getElementById("play").addEventListener("click", () => {
      const video = document.createElement("iframe");
      video.src = "https://www.youtube-nocookie.com/embed/tmC1iYXb_og?autoplay=1&start=61";
      video.title = "Polar Express Train Ambience";
      video.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      video.referrerPolicy = "strict-origin-when-cross-origin";
      video.allowFullscreen = true;
      cover.replaceWith(video);
    });
  </script>
</body>
</html>
